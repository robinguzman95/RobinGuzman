# API + PostgreSQL en local:  docker compose up --build   →  http://localhost:8000/docs
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lotolab
      POSTGRES_PASSWORD: lotolab
      POSTGRES_DB: lotolab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lotolab"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      LOTOLAB_DATABASE_URL: postgresql://lotolab:lotolab@db:5432/lotolab
      LOTOLAB_CORS_ORIGINS: http://localhost:3000
      LOTOLAB_INGEST_TOKEN: ${LOTOLAB_INGEST_TOKEN:-cambia-este-token}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
