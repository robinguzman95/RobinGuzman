[project]
name = "lotolab"
version = "0.1.0"
description = "Laboratorio estadístico de loterías colombianas (Baloto, Revancha, MiLoto, ColorLoto)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "psycopg[binary]>=3.2",
]

[project.scripts]
lotolab = "app.ingest.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
